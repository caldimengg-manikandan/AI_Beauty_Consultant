<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/images/consultant_avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#A855F7" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
    <meta
      name="description"
      content="Your Personal AI Beauty Consultant"
    />
    <link rel="apple-touch-icon" href="/images/consultant_avatar.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AI Beauty Consultant | GlowAI</title>
    <style>
      /* Hide Google Translate Toolbar */
      .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame {
        display: none !important;
      }
      body {
        top: 0 !important;
      }
      /* Hide Google Translate Icon/Widget */
      .goog-te-gadget-icon {
        display: none !important;
      }
      /* Hide Google Translate Tooltips on Hover */
      #goog-gt-tt, .goog-tooltip, .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Google Translate Script (Pro Integration) -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'hi,ta,es,fr,ar,en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="google_translate_element" style="position:fixed; top:-1000px; left:-1000px; opacity:0; pointer-events:none;"></div>
    
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
